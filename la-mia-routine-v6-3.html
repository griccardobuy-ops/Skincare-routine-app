// ── EXPORT / IMPORT ──────────────────────────────────────────────────────────
function exportData(){
  const data = {
    version: '5.8',
    exported: new Date().toISOString(),
    chk, notes, openSecs, customNames, globalNote,
    skData, woData, brainState,
    customTagsData, cardOrder, cardBadges,
    theme: currentTheme,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'la-mia-routine-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.version) throw new Error('File non valido');
      if(!confirm('Importare le impostazioni? I dati attuali verranno sostituiti.')) return;
      if(data.chk)             { chk = data.chk;                       saveChk(); }
      if(data.notes)           { notes = data.notes;                   saveNotes(); }
      if(data.openSecs)        { openSecs = data.openSecs;             saveSecs(); }
      if(data.customNames)     { customNames = data.customNames;       saveNames(); }
      if(data.globalNote!=null){ globalNote = data.globalNote;        saveGlobalNote(); }
      if(data.skData)          { skData = data.skData;                 saveSk(); }
      if(data.woData)          { woData = data.woData;                 saveWo(); }
      if(data.brainState)      { brainState = data.brainState;         saveBrain(); }
      if(data.customTagsData)  { customTagsData = data.customTagsData; saveCustomTags(); }
      if(data.cardOrder)       { cardOrder = data.cardOrder;           saveCardOrder(); }
      if(data.cardBadges)      { cardBadges = data.cardBadges;         saveCardBadges(); }
      if(data.theme)           { applyTheme(data.theme); }

      // ── Compatibilità backup vecchio formato ──────────────────────────────
      // Se skData è vuoto ma esistono voci nei vecchi M/E statici con chk,
      // oppure se il backup è versione < 5.8 e non ha skData, offri migrazione
      if(!data.skData && data.version && parseFloat(data.version) < 5.1){
        if(confirm('Backup vecchio formato rilevato. Vuoi popolare mattina e sera con i dati di default?')){
          for(let d=0;d<7;d++){
            const mkM = d+'-sk-morning';
            const mkE = d+'-sk-evening';
            if(!skData[mkM]) skData[mkM] = { items: M.map(s=>({id:woNewId(),name:s.n,timing:s.t||'',tags:s.tags||[],infoKey:s.k||'',done:!!(data.chk&&data.chk[d+'-m-'+M.indexOf(s)])})) };
            if(!skData[mkE]) skData[mkE] = { items: E[d].map(s=>({id:woNewId(),name:s.n,timing:s.t||'',tags:s.tags||[],infoKey:s.k||'',done:!!(data.chk&&data.chk[d+'-e-'+E[d].indexOf(s)])})) };
          }
          saveSk();
        }
      }

      const gn = document.getElementById('gnoteArea');
      if(gn) gn.value = globalNote;
      renderDays(); renderAll();
      alert('✓ Impostazioni importate correttamente!');
    } catch(err){
      alert('Errore: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

// ── THEME ──
let currentTheme = 'dark';
try{ currentTheme = localStorage.getItem('sk_theme') || 'dark'; }catch(e){}
function applyTheme(t){
  currentTheme = t;
  document.body.classList.toggle('light', t === 'light');
  const lbl = document.getElementById('themeLabel');
  if(lbl) lbl.textContent = t === 'light' ? 'Passa al tema scuro' : 'Passa al tema chiaro';
  try{ localStorage.setItem('sk_theme', t); }catch(e){}
  // aggiorna colori SVG yoga
  updateYogaSvgColors(t);
}

function updateYogaSvgColors(t){
  // colori dark → light mapping
  const pairs = [
    ['#1a1612', '#f0e8e0'],  // sfondo SVG
    ['#141210', '#f0e8e0'],  // sfondo alternativo
    ['#3a2e28', '#f5e8d8'],  // viso
    ['#4a3a30', '#e4cfc0'],  // collo / orecchie / mani
    ['#5a3a28', '#c4906a'],  // iride
    ['#6a5040', '#c4a882'],  // capelli
  ];
  document.querySelectorAll('.yill svg').forEach(svg => {
    svg.querySelectorAll('[fill]').forEach(el => {
      const f = el.getAttribute('fill').toLowerCase();
      for(const [dark, light] of pairs){
        if(t === 'light' && f === dark){ el.setAttribute('fill', light); break; }
        if(t === 'dark'  && f === light){ el.setAttribute('fill', dark);  break; }
      }
    });
  });
}
function toggleTheme(){
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}
// apply on load
applyTheme(currentTheme);

// ── FOCUS MODE ───────────────────────────────────────────────────────────────
function enterFocus(id, icon, title){
  const card = document.getElementById('card-'+id);
  if(!card) return;
  const body = card.querySelector('.card-body');
  if(!body) return;
  // Clone content into focus overlay
  document.getElementById('focusIcon').textContent  = icon;
  document.getElementById('focusTitle').textContent = customNames['card-title-'+id] || title;
  document.getElementById('focusBody').innerHTML    = body.innerHTML;
  document.getElementById('focusOv').classList.add('open');
  // Prevent body scroll
  document.body.style.overflow = 'hidden';
  // Apply theme to focus overlay
  updateYogaSvgColors(currentTheme);
}

function exitFocus(){
  document.getElementById('focusOv').classList.remove('open');
  document.body.style.overflow = '';
}

// Close focus on Escape key
document.addEventListener('keydown', e => { if(e.key==='Escape') exitFocus(); });

// ── TIMER FLOTTANTE ──────────────────────────────────────────────────────────
let ft = { running:false, remaining:0, interval:null };

function toggleFTimer(){
  document.getElementById('ftimerPanel').classList.toggle('open');
  // rimuovi animazione quando apri
  document.getElementById('ftimerBtn').classList.remove('done');
  document.getElementById('ftimerBadge').classList.remove('show');
}
function ftimerToggle(){
  if(ft.running){ ftimerPause(); } else { ftimerStart(); }
}
function ftimerStart(){
  if(ft.remaining <= 0){
    const m = parseInt(document.getElementById('ftimerMin').value)||0;
    const s = parseInt(document.getElementById('ftimerSec').value)||0;
    ft.remaining = m*60+s;
    if(ft.remaining <= 0) return;
  }
  ft.running = true;
  document.getElementById('ftimerStartBtn').textContent = '⏸ Pausa';
  document.getElementById('ftimerDisplay').classList.add('running');
  document.getElementById('ftimerDisplay').classList.remove('done');
  ft.interval = setInterval(ftimerTick, 1000);
}
function ftimerPause(){
  ft.running = false;
  clearInterval(ft.interval);
  document.getElementById('ftimerStartBtn').textContent = '▶ Riprendi';
  document.getElementById('ftimerDisplay').classList.remove('running');
}
function ftimerTick(){
  ft.remaining--;
  ftimerUpdateDisplay();
  if(ft.remaining <= 0){
    clearInterval(ft.interval);
    ft.running = false;
    document.getElementById('ftimerStartBtn').textContent = '▶ Avvia';
    document.getElementById('ftimerDisplay').classList.remove('running');
    document.getElementById('ftimerDisplay').classList.add('done');
    document.getElementById('ftimerLabel').textContent = '✓ completato';
    if(navigator.vibrate) navigator.vibrate([300,100,300]);
    // se il pannello è chiuso, anima il bottone
    const panel = document.getElementById('ftimerPanel');
    if(!panel.classList.contains('open')){
      document.getElementById('ftimerBtn').classList.add('done');
      document.getElementById('ftimerBadge').classList.add('show');
    }
  }
}
function ftimerReset(){
  clearInterval(ft.interval);
  ft.running = false; ft.remaining = 0;
  document.getElementById('ftimerStartBtn').textContent = '▶ Avvia';
  document.getElementById('ftimerDisplay').classList.remove('running','done');
  document.getElementById('ftimerLabel').textContent = 'imposta minuti e secondi';
  const m = parseInt(document.getElementById('ftimerMin').value)||0;
  const s = parseInt(document.getElementById('ftimerSec').value)||0;
  ftimerUpdateDisplay(m*60+s);
}
function ftimerUpdateDisplay(val){
  const v = val !== undefined ? val : ft.remaining;
  const m = Math.floor(v/60); const s = v%60;
  document.getElementById('ftimerDisplay').textContent =
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

renderDays();
renderAll();
updateYogaSvgColors(currentTheme);

// init global note
const _gn = document.getElementById('gnoteArea');
if(_gn) _gn.value = globalNote;
</script>
