<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Mia Routine v6.3</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Mia Routine">
<meta name="theme-color" content="#f5f0eb">
<link rel="apple-touch-icon" id="appIcon">
<link rel="manifest" id="manifestLink">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:       #141210;
  --bg2:      #1c1916;
  --bg3:      #242018;
  --line:     #2e2a24;
  --muted:    #5a5248;
  --sub:      #7a7068;
  --text:     #f0ead8;
  --textsoft: #c8bfaa;
  --gold:     #c8a84a;
  --gold2:    #e8c86a;
  --golddim:  #3a3020;
  --mc:#a07830;--ec:#6a5a8e;--tc:#5a7a6a;--yc:#7a5a80;--wc:#4a6a8a;--bc:#5a7a5a;--bb:#4a7a6a;
  --cream:#f0ead8;--warm:#2e2a24;--sand:#5a5248;--terracotta:#c8a84a;--deep:#f0ead8;
}
/* ── TEMA CHIARO ── */
body.light{
  --bg:       #f5f0eb;
  --bg2:      #ffffff;
  --bg3:      #e8ddd2;
  --line:     #e0d4c4;
  --muted:    #c9b8a4;
  --sub:      #a09080;
  --text:     #3d2b1f;
  --textsoft: #5a4030;
  --gold:     #b07a5c;
  --gold2:    #c89070;
  --golddim:  #f5ece6;
  --mc:#e8b850;--ec:#8c7a9e;--tc:#7a9e8c;--yc:#9e7a8c;--wc:#7a8e9e;
  --cream:#f5f0eb;--warm:#e8ddd2;--sand:#c9b8a4;--terracotta:#b07a5c;--deep:#3d2b1f;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  min-height:100vh;
  padding:1.5rem 1rem 5rem;
}

/* ─ HEADER ─ */
header{
  text-align:center;
  margin-bottom:2rem;
  padding-bottom:1.5rem;
  border-bottom:1px solid var(--line);
}
h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;color:var(--text);}
h1 em{font-style:italic;color:var(--gold);}
.sub{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.35rem;}

/* ─ DAY SELECTOR ─ */
.days{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.8rem;}
.db{
  background:none;border:1px solid var(--line);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.4rem .75rem;cursor:pointer;border-radius:2px;transition:all .2s;
}
.db.on{background:var(--gold);border-color:var(--gold);color:#0a0a0a;font-weight:600;}
.db:hover:not(.on){border-color:var(--gold);color:var(--gold);}

/* ─ ACCORDION CARD ─ */
.card{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:6px;
  margin-bottom:.7rem;
  overflow:hidden;
}
.card-hd{
  display:flex;align-items:center;gap:.65rem;
  padding:.85rem 1.1rem;
  background:var(--bg3);
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.card-hd:hover{background:#2a2620;}
.card-hd .icon{font-size:.95rem;}
.card-hd .title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:var(--text);}
.card-title-input{
  font-family:'Cormorant Garamond',serif;font-size:1.05rem;font-weight:400;
  background:none;border:none;border-bottom:1.5px solid var(--gold);
  color:var(--text);outline:none;width:130px;padding:0;
}
.badge{
  margin-left:auto;font-size:.48rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.18rem .5rem;border-radius:2px;color:rgba(255,255,255,.8);
  background:var(--muted);white-space:nowrap;
}
.bm{background:var(--mc);}
.be{background:var(--ec);}
.bt{background:var(--tc);}
.by{background:var(--yc);}
.bw{background:var(--wc);}
.chevron{font-size:.65rem;color:var(--muted);margin-left:.3rem;transition:transform .25s;flex-shrink:0;}
.card.shut .chevron{transform:rotate(-90deg);}
.card-body{overflow:hidden;transition:max-height .32s ease,opacity .25s ease;max-height:3000px;opacity:1;}
.card.shut .card-body{max-height:0;opacity:0;}

/* ─ STEPS ─ */
.steps{padding:.3rem 0;}
.step{
  display:flex;align-items:flex-start;gap:.7rem;
  padding:.6rem 1.1rem;
  border-bottom:1px solid var(--line);
  transition:background .12s;
}
.step:last-child{border-bottom:none;}
.step:hover{background:rgba(255,255,255,.02);}
.snum{font-size:.5rem;color:var(--muted);min-width:.9rem;text-align:right;flex-shrink:0;padding-top:3px;}
.chk{
  width:17px;height:17px;
  border:1.5px solid var(--muted);
  border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;margin-top:1px;
}
.step.done .chk{background:var(--gold);border-color:var(--gold);}
.step.done .chk::after{
  content:'';width:5px;height:3px;
  border-left:1.5px solid #0a0a0a;
  border-bottom:1.5px solid #0a0a0a;
  transform:rotate(-45deg) translateY(-1px);
}
.si{flex:1;cursor:pointer;min-width:0;}
.snr{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;}
.sn{
  font-size:.72rem;line-height:1.4;color:var(--text);
  border-bottom:1px dashed transparent;
  transition:border-color .15s,color .15s;
}
.si:hover .sn{color:var(--gold);border-bottom-color:var(--gold);}
.step.done .sn{text-decoration:line-through;color:var(--muted);}
.ssub{font-size:.54rem;color:var(--sub);font-style:italic;margin-top:.12rem;}
.timing{
  display:inline-block;font-size:.46rem;letter-spacing:.06em;text-transform:uppercase;
  background:var(--golddim);color:var(--gold);
  border:1px solid #4a3a10;
  padding:.08rem .35rem;border-radius:2px;flex-shrink:0;
}
.stag{font-size:.46rem;letter-spacing:.08em;text-transform:uppercase;padding:.1rem .35rem;border-radius:2px;flex-shrink:0;}
.tag-retinoid{background:#2a1f30;color:#b088c0;}
.tag-glycolic{background:#1a2820;color:#70a888;}
.tag-peptide {background:#2a2018;color:var(--gold);}
.tag-spf     {background:#2a2810;color:#b8a840;}
.tag-capelli {background:#1e1e2e;color:#8888c0;}
.tag-rose    {background:#2a1820;color:#c07888;}

/* ─ PROGRESS ─ */
.prog{padding:0 1.1rem .75rem;}
.pbg{height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
.pfi{height:100%;background:var(--gold);border-radius:2px;transition:width .4s;}
.plb{font-size:.5rem;color:var(--muted);letter-spacing:.1em;margin-top:.3rem;}

/* ─ TIP ─ */
.tip-hd{background:#1a1e20;}
.tip-bd{padding:1rem 1.1rem;}
.tip-tx{font-size:.72rem;line-height:1.8;color:var(--textsoft);}

/* ─ YOGA ─ */
.yoga-hd{background:#1e1a20;}
.yoga-bd{padding:1rem 1.1rem;}
.yna{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--text);margin-bottom:.2rem;}
.yzo{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--yc);margin-bottom:.85rem;}
.yill{width:100%;background:var(--bg3);border-radius:6px;margin-bottom:.9rem;padding:.6rem;display:flex;align-items:center;justify-content:center;}
.yill svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto;}
.ysteps{list-style:none;margin-bottom:.7rem;}
.ysteps li{font-size:.68rem;line-height:1.65;padding:.22rem 0;border-bottom:1px solid var(--line);display:flex;gap:.5rem;color:var(--textsoft);}
.ysteps li:last-child{border-bottom:none;}
.ysteps li::before{content:attr(data-n);color:var(--yc);font-size:.58rem;flex-shrink:0;padding-top:.1rem;}
.yreps{display:inline-block;font-size:.56rem;background:var(--golddim);color:var(--yc);padding:.18rem .55rem;border-radius:2px;}
body.light .yreps{background:#f4eef3;}
.yvideo{
  display:inline-flex;align-items:center;gap:.35rem;margin-top:.65rem;
  font-size:.58rem;color:var(--gold);
  background:var(--golddim);border:1px solid #4a3a10;
  padding:.28rem .65rem;border-radius:3px;
  transition:background .15s;cursor:pointer;
  font-family:'DM Mono',monospace;letter-spacing:.06em;
}
.yvideo:hover{background:#4a3a18;}

/* ─ WORKOUT ─ */
.wo-hd{background:#1a1e22;}
.wo-bd{padding:1rem 1.1rem;}
.wo-type{font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--wc);margin-bottom:.3rem;}
.wo-name{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--text);margin-bottom:.15rem;}
.wo-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem;}
.wo-pill{font-size:.48rem;letter-spacing:.08em;text-transform:uppercase;background:#1a2230;color:var(--wc);padding:.12rem .45rem;border-radius:2px;}
.wo-circuit{background:#1a2230;border-radius:3px;padding:.4rem .7rem;margin-bottom:.7rem;font-size:.56rem;color:var(--wc);letter-spacing:.06em;}
.wo-exercises{list-style:none;margin-bottom:.7rem;}
.wo-ex{display:flex;align-items:flex-start;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
.wo-ex:last-child{border-bottom:none;}
.wo-ex-num{font-size:.5rem;color:var(--muted);min-width:1rem;text-align:right;flex-shrink:0;padding-top:.15rem;}
.wo-ex-body{flex:1;cursor:pointer;}
.wo-ex-name{font-size:.72rem;line-height:1.3;color:var(--text);}
.wo-ex-detail{font-size:.56rem;color:var(--sub);margin-top:.1rem;font-style:italic;}
.wo-ex-chk{width:17px;height:17px;border:1.5px solid var(--muted);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;margin-top:1px;}
.wo-ex.done .wo-ex-chk{background:var(--wc);border-color:var(--wc);}
.wo-ex.done .wo-ex-chk::after{content:'';width:5px;height:3px;border-left:1.5px solid white;border-bottom:1.5px solid white;transform:rotate(-45deg) translateY(-1px);}
.wo-ex.done .wo-ex-name{text-decoration:line-through;color:var(--muted);}
.wo-rest-day{text-align:center;padding:1.5rem 1rem;}
.wo-rest-icon{font-size:2rem;margin-bottom:.5rem;}
.wo-rest-tx{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;color:var(--muted);}
.wo-rest-sub{font-size:.6rem;color:var(--sub);margin-top:.3rem;}
.wo-add-btn{
  display:block;width:100%;margin-top:.8rem;padding:.65rem;
  background:none;border:1px dashed var(--wc);color:var(--wc);
  font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border-radius:2px;transition:all .2s;
}
.wo-add-btn:hover{background:var(--wc);color:white;}
.wo-move-col{display:flex;flex-direction:column;gap:1px;flex-shrink:0;margin-right:.1rem;}
.wo-move-btn{background:none;border:none;color:var(--muted);font-size:.7rem;cursor:pointer;padding:0 .2rem;line-height:1.4;transition:color .15s;}
.wo-move-btn:hover{color:var(--gold);}
.wo-move-placeholder{display:inline-block;width:1.2rem;height:1rem;}
.wo-copy-wrap{margin-top:.9rem;padding-top:.8rem;border-top:1px dashed var(--line);}
.wo-copy-label{font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem;}
.wo-copy-days{display:flex;gap:.35rem;flex-wrap:wrap;}
.wo-copy-day-btn{background:none;border:1px solid var(--line);color:var(--muted);font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.07em;padding:.3rem .55rem;border-radius:3px;cursor:pointer;transition:all .2s;}
.wo-copy-day-btn:hover{border-color:var(--wc);color:var(--wc);}

/* ─ RULES ─ */
.rules{
  background:var(--bg2);border:1px solid var(--line);
  border-radius:6px;padding:.9rem 1.1rem;margin-bottom:.7rem;
}
.rt{font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.65rem;}
.rule{font-size:.66rem;line-height:1.55;padding:.26rem 0;border-bottom:1px solid var(--line);display:flex;gap:.5rem;color:var(--textsoft);}
.rule:last-child{border-bottom:none;}
.rule::before{content:'—';color:var(--muted);flex-shrink:0;}

/* ─ RESET BUTTON ─ */
.reset{
  display:block;width:100%;padding:.7rem;
  background:none;border:1px solid var(--line);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border-radius:4px;transition:all .2s;margin-top:.5rem;
}
.reset:hover{border-color:var(--gold);color:var(--gold);}

/* ─ NOTE GLOBALI ─ */
.gnotes-hd{background:#181814;}
.gnotes-bd{padding:1rem 1.1rem;}
.gnotes-ta{
  width:100%;min-height:140px;padding:.7rem .8rem;
  background:#0e0e0c;border:1px solid var(--line);border-radius:4px;
  font-family:'DM Mono',monospace;font-size:.7rem;line-height:1.75;
  color:var(--text);resize:vertical;outline:none;transition:border-color .2s;
}
.gnotes-ta:focus{border-color:var(--gold);}
.gnotes-ta::placeholder{color:var(--muted);}
.gnotes-saved{font-size:.5rem;color:var(--gold);letter-spacing:.08em;margin-top:.3rem;opacity:0;transition:opacity .5s;}
.gnotes-saved.show{opacity:1;}

/* ─ CONGRATS ─ */
.congrats{
  text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:1.1rem;color:var(--gold);padding:.6rem 0;
  opacity:0;transition:opacity .5s;pointer-events:none;
}
.congrats.show{opacity:1;}

/* ─ SHEET (bottom sheet) ─ */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet{
  background:var(--bg2);width:100%;max-width:520px;
  border-radius:14px 14px 0 0;border-top:1px solid var(--line);
  padding:1.4rem 1.4rem 3rem;max-height:85vh;overflow-y:auto;
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.sh{width:34px;height:3px;background:var(--muted);border-radius:2px;margin:0 auto 1.2rem;}
.shn{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:400;margin-bottom:.3rem;color:var(--text);}
.shta{margin-bottom:1rem;display:flex;gap:.4rem;flex-wrap:wrap;}
.shbl{margin-bottom:.9rem;padding-bottom:.9rem;border-bottom:1px solid var(--line);}
.shbl:last-child{border-bottom:none;margin-bottom:0;}
.shla{font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.shqt{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--gold);}
.shtx{font-size:.7rem;line-height:1.75;color:var(--textsoft);}
.shcl{
  display:block;width:100%;margin-top:1.3rem;padding:.75rem;
  background:var(--gold);color:#0a0a0a;border:none;
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border-radius:4px;font-weight:600;
  transition:background .2s;
}
.shcl:hover{background:var(--gold2);}

/* ─ NOTE IN SHEET ─ */
.notes-wrap{margin-top:.5rem;}
.notes-ta{
  width:100%;min-height:80px;padding:.6rem .75rem;
  background:#0e0e0c;border:1px solid var(--line);border-radius:4px;
  font-family:'DM Mono',monospace;font-size:.68rem;line-height:1.65;
  color:var(--text);resize:vertical;outline:none;transition:border-color .2s;
}
.notes-ta:focus{border-color:var(--gold);}
.notes-ta::placeholder{color:var(--muted);}
.notes-saved{font-size:.5rem;color:var(--gold);letter-spacing:.08em;margin-top:.3rem;opacity:0;transition:opacity .4s;}
.notes-saved.show{opacity:1;}
.note-label{
  display:inline-flex;align-items:center;gap:.25rem;
  font-size:.46rem;letter-spacing:.07em;text-transform:uppercase;
  background:#1a2030;color:#6898c0;
  border:1px solid #2a3848;
  padding:.1rem .35rem;border-radius:2px;flex-shrink:0;
}
.title-input{
  width:100%;padding:.45rem .6rem;margin-top:.4rem;
  background:#0e0e0c;border:1px solid var(--line);border-radius:4px;
  font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--text);
  outline:none;transition:border-color .2s;
}
.title-input:focus{border-color:var(--gold);}
.title-reset{font-size:.52rem;color:var(--muted);cursor:pointer;margin-top:.25rem;display:inline-block;text-decoration:underline;}
.title-reset:hover{color:var(--gold);}

/* ─ VIDEO POPUP ─ */
.vov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:1.2rem;}
.vov.open{display:flex;}
.vpop{background:#0e0c0a;border:1px solid var(--line);border-radius:10px;width:100%;max-width:480px;overflow:hidden;animation:up .22s ease;}
.vpop-hd{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--line);}
.vpop-title{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--text);font-style:italic;flex:1;margin-right:.5rem;}
.vpop-close{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:.1rem .3rem;line-height:1;}
.vpop-close:hover{color:var(--text);}
.vpop-thumb{position:relative;padding-bottom:56.25%;overflow:hidden;background:#111;}
.vpop-frame{position:relative;padding-bottom:56.25%;overflow:hidden;background:#000;}
.vpop-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.vpop-thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.8;}
.vpop-thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;background:rgba(200,168,74,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.vpop-thumb .play-icon::after{content:'';border-left:22px solid #0a0a0a;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:4px;}
.vpop-actions{padding:.9rem 1rem;}
.vpop-btn{
  display:block;text-align:center;padding:.7rem;
  background:var(--gold);color:#0a0a0a;text-decoration:none;
  font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  border-radius:4px;transition:background .15s;font-weight:600;
}
.vpop-btn:hover{background:var(--gold2);}

/* ─ WORKOUT SHEET EXTRAS ─ */
.wo-add-delete{
  background:none;border:1px dashed #3a2020;color:#885050;
  font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  padding:.5rem .8rem;border-radius:2px;cursor:pointer;width:100%;transition:all .2s;
}
.wo-add-delete:hover{background:#3a2020;color:#c08080;}
/* immagine esercizio */
.wo-img-preview{margin-top:.6rem;border-radius:6px;overflow:hidden;max-height:220px;}
.wo-img-preview img{width:100%;height:100%;object-fit:cover;display:block;border-radius:6px;}
/* immagine nella lista esercizi */
.wo-ex-img{width:100%;border-radius:4px;margin-top:.4rem;max-height:160px;object-fit:cover;display:block;}

/* ── TIP INTERATTIVO ── */
.tip-icon{font-size:1.4rem;margin-bottom:.5rem;}
.tip-titolo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--text);margin-bottom:.5rem;}
.tip-testo{font-size:.7rem;line-height:1.8;color:var(--textsoft);margin-bottom:.9rem;}
.tip-citazione{
  border-left:2px solid var(--gold);padding:.5rem .8rem;
  margin:.7rem 0;font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:.9rem;color:var(--textsoft);
}
.tip-autore{font-size:.52rem;color:var(--muted);letter-spacing:.08em;margin-top:.2rem;font-style:normal;}
.tip-domanda{
  background:var(--golddim);border:1px solid #4a3a10;
  border-radius:4px;padding:.7rem .85rem;
  font-size:.68rem;line-height:1.65;color:var(--gold);
  margin:.7rem 0;font-style:italic;
}
body.light .tip-domanda{background:#f5ece6;border-color:#e0c8b0;color:#b07a5c;}
.tip-textarea{
  width:100%;min-height:80px;padding:.6rem .75rem;margin-top:.5rem;
  background:var(--bg);border:1px solid var(--line);border-radius:4px;
  font-family:'DM Mono',monospace;font-size:.68rem;line-height:1.65;
  color:var(--text);resize:vertical;outline:none;transition:border-color .2s;
}
body.light .tip-textarea{background:#faf7f4;}
.tip-textarea:focus{border-color:var(--gold);}
.tip-textarea::placeholder{color:var(--muted);}
/* Timer */
.tip-intro{font-size:.62rem;color:var(--muted);margin-bottom:.7rem;font-style:italic;}
.tip-timer{text-align:center;padding:.5rem 0;}
.tip-fase-label{
  font-family:'Cormorant Garamond',serif;font-size:1.1rem;
  color:var(--text);margin-bottom:.3rem;min-height:1.6rem;
}
.tip-countdown{
  font-size:3rem;font-family:'DM Mono',monospace;
  color:var(--gold);line-height:1;margin:.3rem 0;
  transition:color .4s;
}
.tip-progress-ring{margin:.5rem auto;display:block;}
.tip-rip{font-size:.55rem;color:var(--muted);letter-spacing:.1em;margin-bottom:.7rem;}
.tip-avvia{
  display:inline-block;padding:.6rem 1.4rem;
  background:var(--gold);color:#0a0a0a;border:none;
  font-family:'DM Mono',monospace;font-size:.6rem;
  letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;border-radius:4px;font-weight:600;
  transition:background .2s;
}
.tip-avvia:hover{background:var(--gold2);}
body.light .tip-avvia{color:white;}
.tip-avvia:disabled{opacity:.4;cursor:default;}

/* ── TIMER GLOBALE FLOTTANTE ── */
.ftimer-btn{
  position:fixed;bottom:1.4rem;right:1.2rem;z-index:400;
  width:52px;height:52px;border-radius:50%;
  background:var(--gold);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  font-size:1.3rem;transition:transform .2s,background .2s;
}
.ftimer-btn:hover{transform:scale(1.08);background:var(--gold2);}
body.light .ftimer-btn{box-shadow:0 4px 20px rgba(0,0,0,.2);}
.ftimer-btn.done{animation:ftpulse 1s ease-in-out infinite;}
@keyframes ftpulse{
  0%,100%{box-shadow:0 0 0 0 rgba(200,168,74,.7), 0 4px 20px rgba(0,0,0,.4);}
  50%{box-shadow:0 0 0 12px rgba(200,168,74,0), 0 4px 20px rgba(0,0,0,.4);}
}
.ftimer-badge{
  position:absolute;top:-3px;right:-3px;
  width:16px;height:16px;border-radius:50%;
  background:#e05040;border:2px solid var(--bg);
  display:none;
}
.ftimer-badge.show{display:block;}
.ftimer-wrap{position:relative;display:inline-block;}

.ftimer-panel{
  position:fixed;bottom:5.2rem;right:1.2rem;z-index:400;
  background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:1.1rem 1.2rem 1rem;
  width:200px;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
  display:none;
  animation:up .2s ease;
}
.ftimer-panel.open{display:block;}
.ftimer-title{
  font-size:.52rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.75rem;
}
.ftimer-display{
  font-family:'DM Mono',monospace;font-size:2.6rem;
  color:var(--text);text-align:center;
  letter-spacing:.05em;margin-bottom:.7rem;
  line-height:1;
}
.ftimer-display.running{color:var(--gold);}
.ftimer-display.done{color:#5a8a7a;}
.ftimer-inputs{
  display:flex;align-items:center;justify-content:center;
  gap:.4rem;margin-bottom:.8rem;
}
.ftimer-input{
  width:46px;padding:.3rem .2rem;text-align:center;
  background:var(--bg);border:1px solid var(--line);border-radius:3px;
  font-family:'DM Mono',monospace;font-size:.85rem;color:var(--text);
  outline:none;transition:border-color .2s;
}
.ftimer-input:focus{border-color:var(--gold);}
body.light .ftimer-input{background:#faf7f4;}
.ftimer-sep{color:var(--muted);font-size:1rem;font-family:'DM Mono',monospace;}
.ftimer-btns{display:flex;gap:.4rem;}
.ftimer-action{
  flex:1;padding:.5rem .2rem;border:none;border-radius:3px;
  font-family:'DM Mono',monospace;font-size:.52rem;
  letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;font-weight:600;
}
.ftimer-start{background:var(--gold);color:#0a0a0a;}
.ftimer-start:hover{background:var(--gold2);}
body.light .ftimer-start{color:white;}
.ftimer-reset{background:var(--bg3);color:var(--muted);border:1px solid var(--line);}
.ftimer-reset:hover{color:var(--text);}
.ftimer-label{
  font-size:.5rem;color:var(--muted);text-align:center;
  margin-top:.5rem;letter-spacing:.06em;
}


/* ── SUDOKU 4×4 ── */
.sdk4-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-width:220px;margin:.7rem auto;background:var(--line);border:2px solid var(--gold);border-radius:4px;padding:3px;}
.sdk4-cell{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:1.2rem;font-weight:600;background:var(--bg2);border-radius:2px;border:none;outline:none;text-align:center;color:var(--text);}
.sdk4-cell.given{color:var(--gold);background:var(--bg3);}
.sdk4-cell.sdk-err{background:#2a1a1a;color:#c08080;}
.sdk4-cell.sdk-filled{color:var(--textsoft);}
.sdk4-cell.sdk4-bb{border-bottom:2px solid var(--gold);}
.sdk4-cell.sdk4-br{border-right:2px solid var(--gold);}
.sdk4-cell:focus{background:#2a2418;}
body.light .sdk4-cell{background:white;color:#3d2b1f;}
body.light .sdk4-cell.given{background:#f5ece6;color:#b07a5c;}
body.light .sdk4-grid{background:#e0d4c4;border-color:#b07a5c;}
body.light .sdk4-cell.sdk4-bb{border-bottom-color:#b07a5c;}
body.light .sdk4-cell.sdk4-br{border-right-color:#b07a5c;}

/* ── MEMORY ── */
.mem-label{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.7rem;}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-width:280px;margin:0 auto .5rem;}
.mem-card{aspect-ratio:1;border-radius:6px;cursor:pointer;position:relative;transition:transform .3s;transform-style:preserve-3d;}
.mem-card .mem-front,.mem-card .mem-back{position:absolute;inset:0;border-radius:6px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .3s;}
.mem-card .mem-front{font-size:1.6rem;background:var(--bg3);border:1px solid var(--line);transform:rotateY(180deg);}
.mem-card .mem-back{font-size:1.1rem;background:var(--golddim);border:1px solid #4a3a10;color:var(--gold);font-family:'DM Mono',monospace;}
.mem-card.flipped .mem-front,.mem-card.matched .mem-front{transform:rotateY(0);}
.mem-card.flipped .mem-back,.mem-card.matched .mem-back{transform:rotateY(-180deg);}
.mem-card.matched .mem-front{background:#1a2a1a;border-color:#2a4a2a;}
body.light .mem-card .mem-back{background:#f5ece6;border-color:#e0c8b0;}
body.light .mem-card .mem-front{background:#f0f4f0;border-color:#d0e0d0;}
body.light .mem-card.matched .mem-front{background:#eef8ee;border-color:#aadaaa;}
.brain-hd{background:#1a201a;}
body.light .brain-hd{background:#eef4ee;}
.brain-bd{padding:1rem 1.1rem;}
.brain-type{font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bc);margin-bottom:.3rem;}
.brain-titolo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--text);margin-bottom:.5rem;}
.brain-testo{font-size:.7rem;line-height:1.75;color:var(--textsoft);margin-bottom:.9rem;}
.brain-esercizio{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:.9rem 1rem;margin-bottom:.8rem;}
body.light .brain-esercizio{background:#f5f8f5;border-color:#ddeedd;}
.brain-domanda{font-size:.75rem;line-height:1.7;color:var(--text);margin-bottom:.7rem;font-style:italic;}
.brain-hint-btn{
  background:none;border:1px solid var(--line);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.4rem .8rem;border-radius:3px;cursor:pointer;transition:all .2s;margin-bottom:.6rem;
}
.brain-hint-btn:hover{border-color:var(--bc);color:var(--bc);}
.brain-hint{font-size:.66rem;color:var(--muted);font-style:italic;display:none;margin-bottom:.6rem;line-height:1.6;}
.brain-hint.show{display:block;}
.brain-risposta-wrap{margin-top:.5rem;}
.brain-risposta-input{
  width:100%;padding:.5rem .7rem;
  background:var(--bg);border:1px solid var(--line);border-radius:4px;
  font-family:'DM Mono',monospace;font-size:.72rem;color:var(--text);
  outline:none;transition:border-color .2s;
}
body.light .brain-risposta-input{background:#faf7f4;}
.brain-risposta-input:focus{border-color:var(--bc);}
.brain-check-btn{
  display:block;width:100%;margin-top:.5rem;padding:.55rem;
  background:var(--bc);color:white;border:none;
  font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;border-radius:3px;transition:background .2s;
}
.brain-check-btn:hover{filter:brightness(1.15);}
.brain-feedback{
  margin-top:.55rem;padding:.5rem .7rem;border-radius:3px;
  font-size:.68rem;line-height:1.6;display:none;
}
.brain-feedback.show{display:block;}
.brain-feedback.ok{background:#1a2e1a;color:#80c880;border:1px solid #2a4a2a;}
.brain-feedback.ko{background:#2e1a1a;color:#c88080;border:1px solid #4a2a2a;}
body.light .brain-feedback.ok{background:#eef8ee;color:#3a7a3a;border-color:#aadaaa;}
body.light .brain-feedback.ko{background:#f8eeee;color:#7a3a3a;border-color:#daaaaa;}
.brain-sequence{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem;}
.brain-seq-item{
  background:var(--golddim);border:1px solid #4a3a10;
  color:var(--gold);border-radius:4px;
  padding:.35rem .6rem;font-family:'DM Mono',monospace;font-size:.8rem;
  cursor:pointer;transition:all .2s;user-select:none;
}
body.light .brain-seq-item{background:#f5ece6;border-color:#e0c8b0;color:#b07a5c;}
.brain-seq-item.selected{background:var(--bc);color:white;border-color:var(--bc);}
.brain-seq-answer{display:flex;gap:.4rem;flex-wrap:wrap;min-height:2.2rem;
  border:1px dashed var(--line);border-radius:4px;padding:.3rem .5rem;margin-bottom:.6rem;
  align-items:center;}
.brain-seq-answer .brain-seq-item{font-size:.72rem;}
.brain-anagram-letters{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.7rem;justify-content:center;}
.brain-letter{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  font-family:'DM Mono',monospace;font-size:1rem;color:var(--text);
  cursor:pointer;transition:all .2s;font-weight:600;
}
body.light .brain-letter{background:#f0f4f0;}
.brain-letter.used{opacity:.3;cursor:default;}
.brain-letter-answer{
  display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem;justify-content:center;
  min-height:2.5rem;align-items:center;
  border-bottom:2px solid var(--line);padding-bottom:.4rem;
}
.brain-letter-answer .brain-letter{background:var(--golddim);border-color:#4a3a10;}

.brain-clear-btn{
  background:none;border:none;color:var(--muted);font-family:'DM Mono',monospace;
  font-size:.52rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  text-decoration:underline;margin-bottom:.5rem;display:block;
}

/* ─ YOGA LOADING ─ */
.yoga-loading{
  text-align:center;padding:2rem 1rem;
  font-size:.65rem;color:var(--muted);letter-spacing:.08em;
}
.yoga-loading-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--gold);margin:0 2px;
  animation:ydot 1.2s ease-in-out infinite;
}
.yoga-loading-dot:nth-child(2){animation-delay:.2s;}
.yoga-loading-dot:nth-child(3){animation-delay:.4s;}
@keyframes ydot{0%,80%,100%{transform:scale(0.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.yoga-regen-btn{
  display:inline-block;margin-top:.6rem;padding:.4rem .8rem;
  background:none;border:1px solid var(--line);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all .2s;
}
.yoga-regen-btn:hover{border-color:var(--gold);color:var(--gold);}

/* ── FOCUS MODE ── */
.card-mgmt{display:flex;gap:1px;margin-left:.2rem;flex-shrink:0;}
.card-mgmt-btn{background:none;border:none;color:var(--muted);font-size:.65rem;cursor:pointer;padding:.1rem .25rem;line-height:1;transition:color .15s;border-radius:2px;}
.card-mgmt-btn:hover{color:var(--gold);}
  font-size:.85rem;cursor:pointer;padding:.1rem .3rem;
  margin-left:.2rem;line-height:1;transition:color .15s;
  flex-shrink:0;
}
.focus-btn:hover{color:var(--gold);}
.focus-ov{
  display:none;position:fixed;inset:0;z-index:500;
  background:var(--bg);
  flex-direction:column;
  animation:up .2s ease;
}
.focus-ov .yill{background:var(--bg3);}
body.light .focus-ov .yill{background:#f0e8e0;}
.focus-ov.open{display:flex;}
.focus-hd{
  display:flex;align-items:center;gap:.7rem;
  padding:1rem 1.2rem .8rem;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.focus-icon{font-size:1.3rem;}
.focus-title{
  font-family:'Cormorant Garamond',serif;
  font-size:1.3rem;font-weight:300;color:var(--text);flex:1;
}
.focus-close{
  background:none;border:none;color:var(--muted);
  font-size:1.1rem;cursor:pointer;padding:.2rem .4rem;
  transition:color .15s;
}
.focus-close:hover{color:var(--text);}
.focus-body{
  flex:1;overflow-y:auto;padding:.5rem 0;
}
/* inside focus: bigger text, more spacing */
.focus-body .step{ padding:.8rem 1.2rem; }

/* ── THEME TOGGLE ── */
.theme-toggle{
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  margin-top:1.2rem;padding:.65rem 1rem;
  background:none;border:1px solid var(--line);
  border-radius:4px;cursor:pointer;width:100%;
  font-family:'DM Mono',monospace;font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);transition:all .2s;
}
.theme-toggle:hover{border-color:var(--gold);color:var(--gold);}
.theme-toggle .toggle-icon{font-size:1rem;transition:transform .3s;}

  font-family:'DM Mono',monospace;font-size:.58rem;
  letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;border-radius:4px;transition:all .2s;text-align:center;
}

let day = new Date().getDay(); day = day===0?6:day-1;
// default: solo la sera è aperta, tutto il resto chiuso
function isSectionOpen(id){
  if(openSecs[id] !== undefined) return openSecs[id] !== false;
  // default: solo la sera è aperta per le sezioni giornaliere, note sempre aperte
  return id === `${day}-e` || id === 'gnote';
}

// ─────────────────────────────────────────────────────────────────────────────
// WORKOUT — fully custom, per-day
// ─────────────────────────────────────────────────────────────────────────────
// Storage: woData = { "0": { title:"Lunedì", items:[{id,name,serie,reps,note,done}] }, ... }
let woData = {};
try{ woData = JSON.parse(localStorage.getItem('sk_wo') || '{}'); }catch(e){}
function saveWo(){ try{ localStorage.setItem('sk_wo', JSON.stringify(woData)); }catch(e){} }

// ensure day entry exists
function woDayEnsure(){
  if(!woData[day]) woData[day] = { title:'', items:[] };
}

function woNewId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,5);
}

function woAddItem(){
  woDayEnsure();
  woData[day].items.push({ id: woNewId(), name:'Nuovo esercizio', serie:'', reps:'', note:'', img:'', done:false });
  saveWo(); renderAll();
}

function woDeleteItem(id){
  woDayEnsure();
  woData[day].items = woData[day].items.filter(x => x.id !== id);
  saveWo(); renderAll();
}

function woToggle(id){
  woDayEnsure();
  const it = woData[day].items.find(x => x.id === id);
  if(it){ it.done = !it.done; saveWo(); renderAll(); }
}

function woMoveItem(id, dir){
  woDayEnsure();
  const items = woData[day].items;
  const idx = items.findIndex(x => x.id === id);
  if(idx === -1) return;
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= items.length) return;
  const tmp = items[idx];
  items[idx] = items[newIdx];
  items[newIdx] = tmp;
  saveWo(); renderAll();
}

function woCopyFromDay(srcDay){
  if(!woData[srcDay] || !woData[srcDay].items || woData[srcDay].items.length === 0){
    alert('Nessun esercizio nel giorno selezionato.'); return;
  }
  if(!confirm('Copiare gli esercizi da ' + ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'][srcDay] + ' in questo giorno? Gli esercizi attuali verranno sostituiti.')) return;
  woDayEnsure();
  // Deep copy items with new IDs to avoid conflicts
  woData[day].items = woData[srcDay].items.map(it => Object.assign({}, it, {id: woNewId(), done: false}));
  woData[day].title = woData[srcDay].title || '';
  saveWo(); renderAll();
}

function woSaveTitle(){
  const el = document.getElementById('woTitleInput');
  if(!el) return;
  woDayEnsure();
  woData[day].title = el.value;
  saveWo();
}

// open the workout item sheet
let currentWoId = null;
function woOpenSheet(id){
  woDayEnsure();
  const it = woData[day].items.find(x => x.id === id);
  if(!it) return;
  currentWoId = id;
  const imgPreview = it.img
    ? `<div class="wo-img-preview"><img src="${esc(it.img)}" alt="" onerror="this.parentNode.style.display='none'"/></div>`
    : '';
  document.getElementById('shBody').innerHTML = `
    <div class="shbl">
      <div class="shla">Nome esercizio</div>
      <input class="title-input" id="woName" type="text" value="${esc(it.name)}" oninput="woSaveField()" placeholder="es. Squat"/>
    </div>
    <div class="shbl" style="display:flex;gap:.7rem;">
      <div style="flex:1">
        <div class="shla">Serie</div>
        <input class="title-input" id="woSerie" type="text" value="${esc(it.serie)}" oninput="woSaveField()" placeholder="es. 3"/>
      </div>
      <div style="flex:1">
        <div class="shla">Reps / Durata</div>
        <input class="title-input" id="woReps" type="text" value="${esc(it.reps)}" oninput="woSaveField()" placeholder="es. 12 / 40s"/>
      </div>
    </div>
    <div class="shbl">
      <div class="shla">Immagine di riferimento</div>
      <input class="title-input" id="woImg" type="url" value="${esc(it.img||'')}" oninput="woSaveField();woUpdateImgPreview()" placeholder="https://... incolla link immagine"/>
      ${imgPreview}
    </div>

function woUpdateImgPreview(url){
  if(url === undefined){
    const im = document.getElementById('woImg');
    url = im ? im.value.trim() : '';
  }
  let preview = document.getElementById('woImgPreview');
  if(!preview){
    const im = document.getElementById('woImg');
    if(!im) return;
    preview = document.createElement('div');
    preview.id = 'woImgPreview';
    preview.className = 'wo-img-preview';
    im.parentNode.insertBefore(preview, im.nextSibling);
  }
  if(url){
    preview.style.display = 'block';
    preview.innerHTML = '<img src="' + url + '" alt="" onerror="this.parentNode.style.opacity=\'0.3\'"/>';
  } else {
    preview.style.display = 'none';
    preview.innerHTML = '';
  }
}

function renderWorkout(){
  woDayEnsure();
  const d = woData[day];
  const items = d.items || [];
  const done = items.filter(x=>x.done).length;
  const total = items.length;
  const pct = total ? Math.round(done/total*100) : 0;

  const itemsHtml = items.map((it,i) => {
    const sub = [it.serie ? it.serie+' serie' : '', it.reps || ''].filter(Boolean).join(' · ');
    const hasNote = it.note && it.note.trim();
    const hasImg  = it.img  && it.img.trim();
    const detailHtml = sub ? '<div class="wo-ex-detail">' + esc(sub) + '</div>' : '';
    const imgHtml = hasImg ? '<img class="wo-ex-img" src="' + esc(it.img) + '" alt="" onerror="this.style.display=\'none\'"/>' : '';
    const noteLabel = hasNote ? '<span class="note-label" style="margin-left:.4rem">✎ nota</span>' : '';
    const imgLabel  = hasImg  ? '<span class="note-label" style="margin-left:.4rem;background:#1a2a1a;color:#70a870;border-color:#2a4a2a">🖼</span>' : '';
    const nameHtml = esc(it.name) + noteLabel + imgLabel;
    const upBtn  = i > 0 ? '<button class="wo-move-btn" onclick="woMoveItem(\'' + it.id + '\',-1)">↑</button>' : '<span class="wo-move-placeholder"></span>';
    const dnBtn  = i < items.length-1 ? '<button class="wo-move-btn" onclick="woMoveItem(\'' + it.id + '\',1)">↓</button>' : '<span class="wo-move-placeholder"></span>';
    return '<li class="wo-ex ' + (it.done?'done':'') + '">'
      + '<div class="wo-move-col">' + upBtn + dnBtn + '</div>'
      + '<span class="wo-ex-num">' + (i+1) + '</span>'
      + '<div class="wo-ex-body" onclick="woOpenSheet(\'' + it.id + '\')">'
      +   '<div class="wo-ex-name">' + nameHtml + '</div>'

      +   imgHtml
      + '</div>'
      + '<div class="wo-ex-chk" onclick="woToggle(\'' + it.id + '\')"></div>'

  const emptyHtml = `<div style="text-align:center;padding:1.4rem 0 .8rem;color:var(--sand);font-size:.68rem;font-style:italic">Nessun esercizio · aggiungine uno ↓</div>`;

    '<button class="wo-copy-day-btn" onclick="woCopyFromDay(' + i + ')">' + name + '</button>'

    + '<input class="title-input" id="woTitleInput" type="text" value="' + esc(d.title) + '" oninput="woSaveTitle()" placeholder="es. Full Body · Lunedì" style="margin-bottom:1rem"/>'

}

function cardTitleEdit(id, defaultTitle){
  const el = document.getElementById('ctitle-'+id);
  if(!el) return;
  const current = customNames['card-title-'+id] || defaultTitle;
  el.innerHTML = '<input id="ctitle-input-'+id+'" class="card-title-input" type="text" value="'+esc(current)+'" onclick="event.stopPropagation()" onkeydown="cardTitleKey(event,\''+id+'\',\''+defaultTitle+'\')" onblur="cardTitleSave(\''+id+'\',\''+defaultTitle+'\')" />';
  const inp = document.getElementById('ctitle-input-'+id);
  if(inp){ inp.focus(); inp.select(); }
}

function cardTitleKey(e, id, def){
  if(e.key === 'Enter')  { e.preventDefault(); cardTitleSave(id, def); }
  if(e.key === 'Escape') { e.preventDefault(); cardTitleCancel(id, def); }
}

function cardTitleSave(id, def){
  const inp = document.getElementById('ctitle-input-'+id);
  if(!inp) return;
  const val = inp.value.trim();
  if(val && val !== def){ customNames['card-title-'+id] = val; }
  else { delete customNames['card-title-'+id]; }
  saveNames();
  const el = document.getElementById('ctitle-'+id);
  if(el) el.innerHTML = customNames['card-title-'+id] || def;
  // re-attach dblclick
  if(el) el.ondblclick = (e) => { e.stopPropagation(); cardTitleEdit(id, def); };
}

function cardTitleCancel(id, def){
  const el = document.getElementById('ctitle-'+id);
  if(el){ el.innerHTML = customNames['card-title-'+id] || def; el.ondblclick = (e) => { e.stopPropagation(); cardTitleEdit(id, def); }; }
}

let tipTimerState = {running:false, phase:0, rep:0, elapsed:0, interval:null};

function renderTip(){
  const t = TIPS[day];
  const e = t.esercizio;
  const r = 44;
  const circ = Math.round(2 * Math.PI * r);
  return '<div class="tip-bd">'
    + '<div class="tip-icon">' + t.icon + '</div>'
    + '<div class="tip-titolo">' + t.titolo + '</div>'
    + '<div class="tip-testo">' + t.testo + '</div>'
    + '<div class="tip-intro">' + e.intro + '</div>'
    + '<div class="tip-timer">'
    + '<div class="tip-fase-label" id="tipFaseLabel">—</div>'
    + '<div class="tip-countdown" id="tipCountdown">—</div>'
    + '<svg class="tip-progress-ring" width="100" height="100" viewBox="0 0 100 100">'
    + '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="4"/>'
    + '<circle id="tipRing" cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--gold)" stroke-width="4"'
    + ' stroke-dasharray="' + circ + '" stroke-dashoffset="' + circ + '"'
    + ' stroke-linecap="round" transform="rotate(-90 50 50)"'
    + ' style="transition:stroke-dashoffset .9s ease,stroke .4s"/>'
    + '</svg>'
    + '<div class="tip-rip" id="tipRip">0 / ' + e.ripetizioni + ' ripetizioni</div>'
    + '<button class="tip-avvia" id="tipBtn" onclick="tipStart()">▶ Avvia</button>'
    + '</div>'
    + '</div>';
}

function getTipNote(){
  try{ return localStorage.getItem('sk_tipnote_' + day) || ''; }catch(e){ return ''; }
}
function saveTipNote(v){
  try{ localStorage.setItem('sk_tipnote_' + day, v); }catch(e){}
}

function tipStart(){
  const t = TIPS[day];
  if(t.type !== 'esercizio') return;
  const e = t.esercizio;
  if(tipTimerState.running){ tipStop(); return; }
  tipTimerState = {running:true, phase:0, rep:0, elapsed:0, interval:null};
  document.getElementById('tipBtn').textContent = '■ Ferma';
  tipTick(e);
  tipTimerState.interval = setInterval(()=>tipTick(e), 1000);
}

function tipStop(){
  clearInterval(tipTimerState.interval);
  tipTimerState.running = false;
  const btn = document.getElementById('tipBtn');
  if(btn){ btn.textContent = '▶ Avvia'; }
  const lbl = document.getElementById('tipFaseLabel');
  if(lbl) lbl.textContent = '—';
  const cd = document.getElementById('tipCountdown');
  if(cd) cd.textContent = '—';
  const ring = document.getElementById('tipRing');
  if(ring){
    const r=44; const circ=Math.round(2*Math.PI*r);
    ring.style.strokeDashoffset = circ;
  }
}

function tipTick(e){
  const s = tipTimerState;
  if(!s.running) return;
  const fase = e.fasi[s.phase];
  const remaining = fase.durata - s.elapsed;

  // update UI
  const lbl = document.getElementById('tipFaseLabel');
  const cd  = document.getElementById('tipCountdown');
  const ring= document.getElementById('tipRing');
  const rip = document.getElementById('tipRip');

  if(lbl) lbl.textContent = fase.label;
  if(cd)  cd.textContent  = remaining + 's';
  if(ring){
    const r=44; const circ=Math.round(2*Math.PI*r);
    const progress = s.elapsed / fase.durata;
    ring.style.strokeDashoffset = Math.round(circ * (1 - progress));
    ring.style.stroke = fase.colore;
  }
  if(rip) rip.textContent = s.rep + ' / ' + e.ripetizioni + ' ripetizioni';

  s.elapsed++;

  if(s.elapsed > fase.durata){
    s.elapsed = 0;
    s.phase++;
    if(s.phase >= e.fasi.length){
      s.phase = 0;
      s.rep++;
      if(s.rep >= e.ripetizioni){
        // DONE
        clearInterval(s.interval);
        s.running = false;
        if(lbl) lbl.textContent = '✓ Completato';
        if(cd)  cd.textContent  = '';
        const btn = document.getElementById('tipBtn');
        if(btn){ btn.textContent = '▶ Rifai'; }
        if(rip) rip.textContent = e.ripetizioni + ' / ' + e.ripetizioni + ' ripetizioni';
        return;
      }
    }
  }
}

// ── Sudoku 4×4 ────────────────────────────────────────────────────────────────
function sudoku4Generate(){
  // All valid 4×4 sudoku bases (2×2 boxes, digits 1-4)
  const bases = [
    [[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],
    [[1,2,3,4],[3,4,1,2],[2,3,4,1],[4,1,2,3]],
    [[1,3,2,4],[2,4,1,3],[3,1,4,2],[4,2,3,1]],
    [[2,1,4,3],[4,3,2,1],[1,2,3,4],[3,4,1,2]],
    [[1,2,3,4],[3,4,2,1],[2,1,4,3],[4,3,1,2]],
    [[1,3,4,2],[2,4,3,1],[3,1,2,4],[4,2,1,3]],
  ];
  const solved = bases[Math.floor(Math.random()*bases.length)].map(r=>[...r]);
  // Remove 8 of 16 cells for medium difficulty
  const puzzle = solved.map(r=>[...r]);
  const cells = [];
  for(let r=0;r<4;r++) for(let cc=0;cc<4;cc++) cells.push([r,cc]);
  for(let i=cells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
  cells.slice(0,8).forEach(([r,cc])=>puzzle[r][cc]=0);
  return {puzzle, solved};
}

function sudoku4Render(data, userGrid, errors){
  const {puzzle,solved} = data;
  let html = '<div class="sdk4-grid" id="sdk4Grid">';
  for(let r=0;r<4;r++){
    for(let cc=0;cc<4;cc++){
      const v = puzzle[r][cc];
      const uv = userGrid && userGrid[r] ? userGrid[r][cc] : 0;
      const err = errors && errors[r] && errors[r][cc];
      const bb = (r===1?'sdk4-bb ':'')+((cc===1)?'sdk4-br ':'');
      if(v){
        html += '<div class="sdk4-cell given '+bb+'">'+v+'</div>';
      } else {
        html += '<input class="sdk4-cell input '+bb+(err?' sdk-err':'')+(uv?' sdk-filled':'')+'" '
          +'type="number" min="1" max="4" value="'+(uv||'')+'" maxlength="1" '
          +'oninput="sdk4Input('+r+','+cc+',this.value)" onfocus="this.select()"/>';
      }
    }
  }
  html += '</div>';
  return html;
}

function sdk4Input(r,cc,val){
  const n=parseInt(val);
  if(!brainState.sdk_user) brainState.sdk_user=Array(4).fill(null).map(()=>Array(4).fill(0));
  brainState.sdk_user[r][cc]=(n>=1&&n<=4)?n:0;
  if(brainState.sdk_errors) brainState.sdk_errors[r][cc]=false;
  saveBrain();
  // check complete
  const {puzzle,solved}=brainState.sdk_data;
  const u=brainState.sdk_user;
  const done=solved.every((row,ri)=>row.every((v,ci)=>puzzle[ri][ci]!==0||(u[ri]&&u[ri][ci]===v)));
  if(done){ brainState['fb_'+brainIdx]='ok'; saveBrain(); renderAll(); }
}

function sdk4Check(){
  const {puzzle,solved}=brainState.sdk_data;
  const u=brainState.sdk_user||[];
  const errs=Array(4).fill(null).map(()=>Array(4).fill(false));
  let hasErr=false;
  for(let r=0;r<4;r++) for(let cc=0;cc<4;cc++){
    if(puzzle[r][cc]===0&&u[r]&&u[r][cc]&&u[r][cc]!==solved[r][cc]){ errs[r][cc]=true; hasErr=true; }
  }
  brainState.sdk_errors=errs;
  if(!hasErr&&u.flat().filter(Boolean).length>0){ brainState['fb_'+brainIdx]='ok'; }
  saveBrain(); renderAll();
}

function sdk4Reveal(){
  const {solved}=brainState.sdk_data;
  brainState.sdk_user=solved.map(r=>[...r]);
  brainState.sdk_errors=null;
  brainState['fb_'+brainIdx]='ok';
  saveBrain(); renderAll();
}

const MEMORY_SETS = [
  {label:'Animali', pairs:['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼']},
  {label:'Frutta',  pairs:['🍎','🍊','🍋','🍇','🍓','🍑','🍍','🥝']},
  {label:'Sport',   pairs:['⚽','🏀','🎾','🏐','🎱','🏓','⛳','🎯']},
  {label:'Natura',  pairs:['🌸','🌺','🌻','🌹','🌷','🌿','🍀','🌵']},
  {label:'Cibo',    pairs:['🍕','🍔','🍜','🍣','🍦','🎂','🍩','🥐']},
];

function memoryGenerate(){
  const set = MEMORY_SETS[Math.floor(Math.random()*MEMORY_SETS.length)];
  const n = 4; // 4 pairs = 8 cards
  const chosen = set.pairs.slice(0,n);
  const cards = [...chosen, ...chosen].map((e,i)=>({id:i,emoji:e,matched:false,flipped:false}));
  // shuffle
  for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
  return {_type:'memory', label:set.label, cards};
}

function memoryFlip(idx){
  const state = brainState.mem_state;
  if(!state) return;
  const cards = state.cards;
  const card = cards[idx];
  if(card.matched||card.flipped) return;
  const flipped = cards.filter(c=>c.flipped&&!c.matched);
  if(flipped.length>=2) return;
  card.flipped=true;
  saveBrain();
  if(flipped.length===1){
    if(flipped[0].emoji===card.emoji){
      setTimeout(()=>{ flipped[0].matched=true; card.matched=true; saveBrain(); renderAll();
        if(cards.every(c=>c.matched)){ brainState['fb_'+brainIdx]='ok'; saveBrain(); renderAll(); }
      },400);
    } else {
      setTimeout(()=>{ flipped[0].flipped=false; card.flipped=false; saveBrain(); renderAll(); },900);
    }
  }
  renderAll();
}

function memoryRender(state){
  const cards = state.cards;
  let html = '<div class="mem-label">Trova le coppie — ' + state.label + '</div>';
  html += '<div class="mem-grid">';
  cards.forEach((card,i)=>{
    const cls = card.matched ? 'mem-card matched' : card.flipped ? 'mem-card flipped' : 'mem-card';
    html += '<div class="'+cls+'" onclick="memoryFlip('+i+')">'
      + '<div class="mem-front">'+card.emoji+'</div>'
      + '<div class="mem-back">?</div>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

  ['AMORE','ARMO','MORA','Roma'],['SALE','ELAS','LASE','SEAL'],
  ['CANE','ACNE','NACE','ANCE'],['PACE','CAPE','PECA','ACEP'],
  ['ARTE','RATE','TERA','RETA'],['LUNA','ULNA','NULA','AULNA'],

  ['SOLE','LOSE','OLES','SLOE'],['NAVE','VANE','AVEN','NEVA'],
  ['PORTA','TROAP','TORPA','PROTA'],['SCALA','LACAS','CLASA','ALACS'],
  ['PIANO','NAIPO','PAINO','OPINA'],['FIORE','FERIO','OFIRE','IFORE'],
  ['STELLE','LETEST','ELTEST','LESTET'],['ALBERO','LABORE','BORELA','ROABLE'],
  ['CUORE','CORURE','OUCER','OCURE'],['SOGNO','GONOS','NGOOS','SONGO'],
  ['VENTO','VETON','OVNET','TONVE'],['LUCE','CLUE','ULCE','ECUL'],
  ['TERRA','RATER','ARRET','TARER'],['ACQUA','QAUCA','CAQU','QUACA'],
  ['BOSCO','COBOS','OBCOS','SCOB'],['FIUME','FUMIE','MIUFE','EFUMI'],
  ['NOTTE','TOTEN','OTTEN','ETTON'],['GIOIA','IAGOI','OIAGI','IOAGI'],
  ['FORZA','ROZFA','ZAFRO','FRAZO'],['TEMPO','TOMP','MOPET','EPOTM'],
];

function anagramGenerate(){
  const entry = ANAGRAM_WORDS[Math.floor(Math.random()*ANAGRAM_WORDS.length)];
  const word = entry[0];
  // shuffle letters
  const letters = word.split('');
  for(let i=letters.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [letters[i],letters[j]]=[letters[j],letters[i]]; }
  // make sure shuffle is different from original
  if(letters.join('')===word){ const tmp=letters[0]; letters[0]=letters[1]; letters[1]=tmp; }
  return {
    type:'anagramma', icon:'🔤', titolo:'Anagramma',
    testo:'Gli anagrammi allenano la flessibilità cognitiva e il pensiero laterale.',
    intro:'Riordina le lettere per formare una parola italiana.',
    letters, parola:word, soluzione:word,
    hint:'Ci sono '+word.length+' lettere. La parola è comune in italiano.',
    feedback_ok:'Perfetto! La parola era '+word+'.',
    feedback_ko:'La parola era '+word+'.'
  };
}

function brainGenerate(){
  const r = Math.random();
  if(r < 0.35){
    const data = sudoku4Generate();
    brainState.sdk_data = data;
    brainState.sdk_user = null;
    brainState.sdk_errors = null;
    return {_type:'sudoku4'};
  }
  if(r < 0.65){
    const m = memoryGenerate();
    brainState.mem_state = m;
    return {_type:'memory'};
  }
  return anagramGenerate();
}


function renderBrain(){
  const b = BRAIN[brainIdx];
  const isGenerated = brainState['gen_'+brainIdx];
  const exercise = isGenerated || b;

  let inner = '';
  const fb = brainState['fb_'+brainIdx];
  const fbClass = fb==='ok'?'ok':fb==='ko'?'ko':'';
  const fbText  = fb==='ok'?(exercise.feedback_ok||'✓ Completato!'):fb==='ko'?(exercise.feedback_ko||'Riprova.'):'';

  if(exercise._type === 'sudoku4'){
    const data = brainState.sdk_data;
    if(!data){ brainState.sdk_data=sudoku4Generate(); brainState.sdk_user=null; brainState.sdk_errors=null; saveBrain(); }
    inner = '<div class="brain-testo">Riempi la griglia: ogni riga, colonna e quadrante 2×2 deve contenere i numeri 1–4 una sola volta.</div>'
      + sudoku4Render(brainState.sdk_data, brainState.sdk_user||[], brainState.sdk_errors||[])
      + '<div style="display:flex;gap:.5rem;margin-top:.7rem">'
      + '<button class="brain-check-btn" style="flex:2" onclick="sdk4Check()">Verifica</button>'
      + '<button class="brain-hint-btn" style="flex:1" onclick="sdk4Reveal()">Soluzione</button>'
      + '</div>';

  } else if(exercise._type === 'memory'){
    if(!brainState.mem_state){ brainState.mem_state=memoryGenerate(); saveBrain(); }
    inner = '<div class="brain-testo">Trova tutte le coppie di emoji uguali. Tocca le carte per girarle.</div>'
      + memoryRender(brainState.mem_state);

  } else if(exercise.type === 'sequenza'){
    const answered = brainState['seq_answer_'+brainIdx]||[];
    const usedIdx  = brainState['seq_used_'+brainIdx]||[];
    inner = '<div class="brain-testo">'+(exercise.testo||'')+'</div>'
      +'<div class="brain-domanda">'+exercise.intro+'</div>'
      +'<div class="brain-sequence" id="brainItems">'
      +exercise.items.map((it,i)=>'<div class="brain-seq-item'+(usedIdx.includes(i)?' selected':'')+'" onclick="brainSeqPick('+i+',this)">'+it+'</div>').join('')
      +'</div>'

      +'</div>'
      +'<button class="brain-clear-btn" onclick="brainSeqClear()">↺ Ricomincia</button>'
      +'<button class="brain-check-btn" onclick="brainSeqCheck()">Verifica</button>';

  } else if(exercise.type === 'risposta'){
    const prev = brainState['ans_'+brainIdx]||'';
    inner = '<div class="brain-testo">'+(exercise.testo||'')+'</div>'
      +'<div class="brain-domanda">'+exercise.domanda+'</div>'
      +'<button class="brain-hint-btn" onclick="brainToggleHint()">💡 Suggerimento</button>'
      +'<div class="brain-hint" id="brainHint">'+(exercise.hint||'')+'</div>'
      +'<div class="brain-risposta-wrap">'
      +'<input class="brain-risposta-input" id="brainInput" type="text" placeholder="La tua risposta..." value="'+esc(prev)+'" oninput="brainSaveInput(this.value)"/>'
      +'<button class="brain-check-btn" onclick="brainCheckAnswer()">Verifica</button>'
      +'</div>';

  } else if(exercise.type === 'anagramma'){
    const usedIdx   = brainState['ana_used_'+brainIdx]||[];
    const ansLetters= brainState['ana_ans_'+brainIdx]||[];
    inner = '<div class="brain-testo">'+(exercise.testo||'')+'</div>'
      +'<div class="brain-domanda">'+exercise.intro+'</div>'

  }

  return '<div class="brain-bd">'
    +'<div class="brain-type">'+exercise.icon+' '+exercise.titolo+'</div>'

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// sequenza
function brainSeqPick(idx, el){
  const b = BRAIN[brainIdx];
  const used = brainState['seq_used_'+brainIdx] || [];
  if(used.includes(idx)) return;
  used.push(idx);
  brainState['seq_used_'+brainIdx] = used;
  const ans = brainState['seq_answer_'+brainIdx] || [];
  ans.push(b.items[idx]);
  brainState['seq_answer_'+brainIdx] = ans;
  saveBrain(); renderAll();
}
function brainSeqClear(){
  delete brainState['seq_used_'+brainIdx];

// Tag custom — caricati da localStorage
let customTagsData = {};
try{ customTagsData = JSON.parse(localStorage.getItem('sk_custom_tags')||'{}'); }catch(e){}
function saveCustomTags(){ try{ localStorage.setItem('sk_custom_tags', JSON.stringify(customTagsData)); }catch(e){} }

const SK_TAGS_BASE   = ['rose','glycolic','retinoid','peptide','spf','capelli'];
const SK_LABELS_BASE = {rose:'Rose',glycolic:'Glicolico',retinoid:'Retinoid',peptide:'Peptidi',spf:'SPF',capelli:'Capelli'};
const SK_COLORS_BASE = {rose:'#b05070',glycolic:'#5a8a7a',retinoid:'#8c7a9e',peptide:'#b07a5c',spf:'#9a6e10',capelli:'#6a5a8a'};

function allTags(){ return [...SK_TAGS_BASE, ...Object.keys(customTagsData)]; }
function tagLabel(k){ return SK_LABELS_BASE[k] || (customTagsData[k]&&customTagsData[k].label) || k; }
function tagColor(k){ return SK_COLORS_BASE[k] || (customTagsData[k]&&customTagsData[k].color) || '#7a7068'; }
function tagBg(k){
  const col = tagColor(k);
  // derive a muted bg from the color
  return customTagsData[k] ? (customTagsData[k].bg||'#2a2020') : undefined;
}

function addCustomTag(label, color){
  if(!label.trim()) return;
  const key = 'ct_' + label.trim().toLowerCase().replace(/\s+/g,'_') + '_' + Date.now().toString(36);
  customTagsData[key] = { label: label.trim(), color };
  saveCustomTags();
  return key;
}

function deleteCustomTag(key){
  delete customTagsData[key];
  saveCustomTags();
  // remove tag from all sk items
  Object.keys(skData).forEach(dk => {
    if(skData[dk]&&skData[dk].items) skData[dk].items.forEach(it => {
      it.tags = (it.tags||[]).filter(t=>t!==key);
    });
  });
  saveSk();
}

function skDayKey(section){ return day + '-sk-' + section; } // 'morning' | 'evening'

function skEnsure(section){
  const k = skDayKey(section);
  if(!skData[k]){
    skData[k] = { items: [] };
  }
}

function skItems(section){
  skEnsure(section);
  return skData[skDayKey(section)].items;
}

function skAddItem(section){
  skEnsure(section);
  skData[skDayKey(section)].items.push({
    id: woNewId(), name:'Nuovo step', timing:'', tags:[], infoKey:'', done:false
  });
  saveSk(); renderAll();
}

function skDeleteItem(section, id){
  skEnsure(section);
  skData[skDayKey(section)].items = skData[skDayKey(section)].items.filter(x => x.id !== id);
  saveSk(); renderAll();
}

function skToggle(section, id){
  skEnsure(section);
  const it = skData[skDayKey(section)].items.find(x => x.id === id);
  if(it){ it.done = !it.done; saveSk(); renderAll(); }
}

function skMove(section, id, dir){
  skEnsure(section);
  const items = skData[skDayKey(section)].items;
  const idx = items.findIndex(x => x.id === id);
  if(idx < 0) return;
  const ni = idx + dir;
  if(ni < 0 || ni >= items.length) return;
  [items[idx], items[ni]] = [items[ni], items[idx]];
  saveSk(); renderAll();
}

function skCopyFrom(section, srcDay){
  const srcKey = srcDay + '-sk-' + section;
  // If srcDay not yet customised, init from static
  if(!skData[srcKey]){
    const src = section === 'morning' ? M : E[srcDay];
    skData[srcKey] = { items: src.map(s => ({
      id: woNewId(), name: s.n, timing: s.t || '', tags: s.tags || [], infoKey: s.k || '', done: false
    })) };
  }
  const srcItems = skData[srcKey].items;
  if(!srcItems.length){ alert('Nessuno step nel giorno selezionato.'); return; }
  const dayNames = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
  if(!confirm('Copiare gli step da ' + dayNames[srcDay] + '? Gli step attuali verranno sostituiti.')) return;
  skEnsure(section);
  skData[skDayKey(section)].items = srcItems.map(it => Object.assign({}, it, {id: woNewId(), done: false}));
  saveSk(); renderAll();
}

function skAddNewTag(){
  const nameEl  = document.getElementById('newTagName');
  const colorEl = document.getElementById('newTagColor');
  if(!nameEl||!nameEl.value.trim()) return;
  const key = addCustomTag(nameEl.value, colorEl.value);
  // auto-select the new tag on current item
  if(currentSkSection && currentSkId){
    skEnsure(currentSkSection);
    const it = skData[skDayKey(currentSkSection)].items.find(x => x.id === currentSkId);
    if(it && !it.tags.includes(key)) it.tags.push(key);
    saveSk();
  }
  // refresh tag section only
  skOpenSheet(currentSkSection, currentSkId);
}

function skDeleteCustomTag(key){
  if(!confirm('Eliminare il tag "' + tagLabel(key) + '"?')) return;
  deleteCustomTag(key);
  skOpenSheet(currentSkSection, currentSkId);
}

function skTagToggle(tag, checked){
  if(!currentSkSection || !currentSkId) return;
  skEnsure(currentSkSection);
  const it = skData[skDayKey(currentSkSection)].items.find(x => x.id === currentSkId);
  if(!it) return;
  if(checked && !it.tags.includes(tag)) it.tags.push(tag);
  if(!checked) it.tags = it.tags.filter(t => t !== tag);
  saveSk();
}

function skSaveField(){
  if(!currentSkSection || !currentSkId) return;
  skEnsure(currentSkSection);
  const it = skData[skDayKey(currentSkSection)].items.find(x => x.id === currentSkId);
  if(!it) return;
  const n = document.getElementById('skName');
  const t = document.getElementById('skTiming');
  const k = document.getElementById('skInfoKey');
  if(n) it.name   = n.value;
  if(t) it.timing = t.value;
  if(k) it.infoKey = k.value;
  saveSk();
}

function renderSkSection(section){
  skEnsure(section);
  const items = skData[skDayKey(section)].items;
  const dayNames = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

  const stepsHtml = items.map((it, i) => {
    const info = it.infoKey ? INFO[it.infoKey] : null;
    const tags = (it.tags||[]).map(t => '<span class="stag tag-' + t + '">' + tlabel(t) + '</span>').join('');
    const tim  = it.timing ? '<span class="timing">' + esc(it.timing) + '</span>' : '';
    const hasNote = notes[it.id] && notes[it.id].trim();
    const noteLabel = hasNote ? '<span class="note-label">✎ nota</span>' : '';
    const sub = info ? '<div class="ssub">' + info.qty + ' · tocca per dettagli</div>' : '<div class="ssub">tocca per modificare</div>';
    const upBtn = i > 0 ? '<button class="wo-move-btn" onclick="skMove(\'' + section + '\',\'' + it.id + '\',-1)">↑</button>' : '<span class="wo-move-placeholder"></span>';
    const dnBtn = i < items.length-1 ? '<button class="wo-move-btn" onclick="skMove(\'' + section + '\',\'' + it.id + '\',1)">↓</button>' : '<span class="wo-move-placeholder"></span>';
    return '<div class="step ' + (it.done?'done':'') + '">'
      + '<div class="wo-move-col">' + upBtn + dnBtn + '</div>'
      + '<span class="snum">' + (i+1) + '</span>'
      + '<div class="chk" onclick="skToggle(\'' + section + '\',\'' + it.id + '\')"></div>'
      + '<div class="si" onclick="skOpenSheet(\'' + section + '\',\'' + it.id + '\')">'
      +   '<div class="snr"><span class="sn">' + esc(it.name) + '</span>' + tim + tags + noteLabel + '</div>'
      +   sub
      + '</div>'
      + '</div>';
  }).join('');

  const done  = items.filter(x=>x.done).length;
  const total = items.length;
  const pct   = total ? Math.round(done/total*100) : 0;
  const prog  = '<div class="prog"><div class="pbg"><div class="pfi" style="width:' + pct + '%"></div></div><div class="plb">' + done + ' / ' + total + ' completati</div></div>';

  const addBtn = '<button onclick="skAddItem(\'' + section + '\')" class="wo-add-btn" style="margin-top:.4rem">+ Aggiungi step</button>';

  const copyBtns = dayNames.map((name, i) => i === day ? '' :
    '<button class="wo-copy-day-btn" onclick="skCopyFrom(\'' + section + '\',' + i + ')">' + name + '</button>'
  ).filter(Boolean).join('');
  const copyWrap = '<div class="wo-copy-wrap"><div class="wo-copy-label">↙ Copia da</div><div class="wo-copy-days">' + copyBtns + '</div></div>';

  return '<div class="steps">' + stepsHtml + '</div>' + prog + addBtn + copyWrap;
}


// ── CARD ORDER & MANAGEMENT ───────────────────────────────────────────────────
const CARD_DEFAULTS = (day) => [
  {id:`${day}-m`,   icon:'☀️', title:'Mattina',          badge:'bm', badgeText:'Tutti i giorni'},
  {id:`${day}-e`,   icon:'🌙', title:`Sera`,              badge:'be', badgeText:'Sera'},
  {id:`${day}-h`,   icon:'💆', title:'Capelli',           badge:'',   badgeText:'Ogni sera'},
  {id:`${day}-yoga`,icon:'🧘', title:'Yoga del Viso',     badge:'by', badgeText:'Face yoga'},
  {id:`${day}-wo`,  icon:'💪', title:'Allenamento',       badge:'bw', badgeText:'Custom'},
  {id:`${day}-tip`, icon:'🧠', title:'Pratica del Giorno',badge:'bt', badgeText:'Mente'},
  {id:'brain',      icon:'🔮', title:'Mente & Memoria',   badge:'bb', badgeText:'Logica'},
];

function getCardDefs(day){
  const defs = CARD_DEFAULTS(day);
  const orderKey = 'order_'+day;
  const order = cardOrder && cardOrder[orderKey];
  let result;
  if(order){
    const sorted = [];
    order.forEach(id => { const d = defs.find(x=>x.id===id); if(d) sorted.push(d); });
    defs.forEach(d => { if(!sorted.find(x=>x.id===d.id)) sorted.push(d); });
    result = sorted;
  } else {
    result = defs;
  }
  // always filter hidden — this runs whether or not there's a saved order
  return result.filter(d => !(cardOrder && cardOrder['hide_'+d.id]));
}

function renderCards(day, bodies){
  const bodyMap = {
    [`${day}-m`]:   bodies.morningBody,
    [`${day}-e`]:   bodies.eveningBody,
    [`${day}-h`]:   bodies.hairBody,
    [`${day}-yoga`]:bodies.yogaBody,
    [`${day}-wo`]:  bodies.workoutBody,
    [`${day}-tip`]: bodies.tipBody,
    'brain':        bodies.brainBody,
  };
  const defs = getCardDefs(day);
  return defs.map(d => {
    const badge = cardBadges[d.id+'_text'] || d.badgeText;
    return makeCard(d.id, d.icon, d.title, d.badge, badge, bodyMap[d.id]||'');
  }).join('');
}

function cardMoveUp(id){
  const orderKey = 'order_'+day;
  if(!cardOrder) cardOrder = {};
  const defs = CARD_DEFAULTS(day).map(d=>d.id);
  let order = (cardOrder[orderKey] || defs).filter(i => !(cardOrder&&cardOrder['hide_'+i]));
  const idx = order.indexOf(id);
  if(idx <= 0) return;
  [order[idx-1], order[idx]] = [order[idx], order[idx-1]];
  cardOrder[orderKey] = order;
  saveCardOrder(); renderAll();
}

function cardMoveDown(id){
  const orderKey = 'order_'+day;
  if(!cardOrder) cardOrder = {};
  const defs = CARD_DEFAULTS(day).map(d=>d.id);
  let order = (cardOrder[orderKey] || defs).filter(i => !(cardOrder&&cardOrder['hide_'+i]));
  const idx = order.indexOf(id);
  if(idx < 0 || idx >= order.length-1) return;
  [order[idx], order[idx+1]] = [order[idx+1], order[idx]];
  cardOrder[orderKey] = order;
  saveCardOrder(); renderAll();
}

function cardHide(id){
  if(!confirm('Nascondere questa sezione? Puoi ripristinarla dal menu "Gestisci sezioni".')) return;
  if(!cardOrder) cardOrder = {};
  cardOrder['hide_'+id] = true;
  saveCardOrder(); renderAll();
}

function cardEditBadge(id, currentText){
  const val = prompt('Testo badge:', currentText||'');
  if(val === null) return;
  cardBadges[id+'_text'] = val.trim() || currentText;
  saveCardBadges(); renderAll();
}

function showManageSections(){
  const all = CARD_DEFAULTS(day);
  const hidden = all.filter(d => cardOrder && cardOrder['hide_'+d.id]);
  if(!hidden.length){ alert('Nessuna sezione nascosta.'); return; }
  const list = hidden.map(d => d.icon + ' ' + (customNames['card-title-'+d.id]||d.title)).join('\n');
  const choice = prompt('Sezioni nascoste:\n' + list + '\n\nScrivi il nome esatto per ripristinare (o lascia vuoto per annullare):');
  if(!choice) return;
  const found = hidden.find(d => (customNames['card-title-'+d.id]||d.title).toLowerCase() === choice.trim().toLowerCase());
  if(found){ delete cardOrder['hide_'+found.id]; saveCardOrder(); renderAll(); }
  else alert('Sezione non trovata.');
}

  openSecs[id]=!wasOpen;
  saveSecs();
}

// ─────────────────────────────────────────────────────────────────────────────
// SHEET
// ─────────────────────────────────────────────────────────────────────────────
let currentSheetKey = null;
let currentStepKey = null;

function openSheet(k, stepKey){
  const d=INFO[k]; if(!d) return;
  currentSheetKey = k;
  currentStepKey = stepKey || k;
  const tags=(d.tags||[]).map(t=>`<span class="stag tag-${t.k}" style="font-size:.58rem;padding:.18rem .45rem">${t.l}</span>`).join('');
  const noteVal = notes[currentStepKey]||'';
  const nameVal = customNames[currentStepKey]||d.n;
  const isCustom = !!customNames[currentStepKey];
  const resetLink = isCustom ? '<span class="title-reset" onclick="resetName()">↺ ripristina nome originale</span>' : '';
  document.getElementById('shBody').innerHTML=`
    <div class="shbl" style="padding-bottom:.8rem;margin-bottom:.8rem;border-bottom:1px dashed var(--warm)">
      <div class="shla">Nome voce</div>
      <input class="title-input" id="titleInput" type="text" value="${nameVal.replace(/"/g,'&quot;')}" oninput="saveName()" placeholder="${d.n}"/>
      ${resetLink}
    </div>
    <div class="shta">${tags}</div>
    <div class="shbl"><div class="shla">Quantità</div><div class="shqt">${d.qty}</div></div>
    <div class="shbl"><div class="shla">Come applicare</div><div class="shtx">${d.come}</div></div>
    <div class="shbl"><div class="shla">Consiglio</div><div class="shtx">${d.cons}</div></div>
    <div class="shbl">
      <div class="shla">Le mie note</div>
      <div class="notes-wrap">
        <textarea class="notes-ta" id="noteTa" placeholder="Aggiungi una nota personale…" oninput="saveNote()">${noteVal}</textarea>
        <div class="notes-saved" id="noteSaved">✓ salvato</div>
      </div>
    </div>
  `;
  document.getElementById('ov').classList.add('open');
}

let noteSaveTimer = null;
function saveName(){
  const inp = document.getElementById('titleInput');
  if(!inp || !currentStepKey) return;
  const d = INFO[currentSheetKey];
  const val = inp.value.trim();
  if(val && val !== d.n){ customNames[currentStepKey]=val; }
  else { delete customNames[currentStepKey]; }
  saveNames();
  // aggiorna link ripristina live nel popup
  const resetEl = inp.nextElementSibling;
  if(customNames[currentStepKey]){
    if(!resetEl || !resetEl.classList.contains('title-reset')){
      const span = document.createElement('span');
      span.className = 'title-reset';
      span.textContent = '↺ ripristina nome originale';
      span.onclick = resetName;
      inp.parentNode.appendChild(span);
    }
  } else {
    if(resetEl && resetEl.classList.contains('title-reset')) resetEl.remove();
  }
  renderAll();
}
function resetName(){
  if(!currentStepKey) return;
  delete customNames[currentStepKey];
  saveNames();
  const inp = document.getElementById('titleInput');
  if(inp){ inp.value = INFO[currentSheetKey].n; }
  const resetEl = inp && inp.nextElementSibling;
  if(resetEl && resetEl.classList.contains('title-reset')) resetEl.remove();
  renderAll();
}
function saveNote(){
  const ta = document.getElementById('noteTa');
  if(!ta || !currentStepKey) return;
  notes[currentStepKey] = ta.value;
  saveNotes();
  clearTimeout(noteSaveTimer);
  const el = document.getElementById('noteSaved');
  if(el){ el.classList.add('show'); noteSaveTimer=setTimeout(()=>{ el.classList.remove('show'); renderAll(); },1800); }
}

function closeSheet(){document.getElementById('ov').classList.remove('open');currentSheetKey=null;}
function maybeClose(e){if(e.target===document.getElementById('ov'))closeSheet();}

function openVideo(url, title){
  const match = url.match(/(?:v=|embed\/|shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  const videoId = match ? match[1] : '';
  const embedUrl = videoId ? 'https://www.youtube.com/embed/' + videoId + '?autoplay=1' : '';
  const thumbUrl = videoId ? 'https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg' : '';

  document.getElementById('vTitle').textContent = title;

  // Try iframe first
  const iframe = document.getElementById('vIframe');
  const frame  = document.getElementById('vFrame');
  const fallback = document.getElementById('vFallback');

  if(embedUrl){
    iframe.src = embedUrl;
    frame.style.display = 'block';
    fallback.style.display = 'none';
    // if iframe fails (CSP), show fallback after short delay
    iframe.onerror = () => showVideoFallback(thumbUrl, url);
    setTimeout(() => {
      // Check if iframe loaded — if height is 0 it was blocked
      if(iframe.clientHeight === 0) showVideoFallback(thumbUrl, url);
    }, 2000);
  } else {
    showVideoFallback(thumbUrl, url);
  }
  document.getElementById('vLink').href = url;
  document.getElementById('vov').classList.add('open');
}

function showVideoFallback(thumbUrl, url){
  document.getElementById('vFrame').style.display = 'none';
  document.getElementById('vFallback').style.display = 'block';
  document.getElementById('vThumb').innerHTML = thumbUrl
    ? '<img src="' + thumbUrl + '" alt="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.8"/><div class="play-icon"></div>'
    : '';
  document.getElementById('vLink').href = url;
}

function closeVideo(e){
  if(e && e.target !== document.getElementById('vov')) return;
  document.getElementById('vov').classList.remove('open');
  document.getElementById('vIframe').src = '';
  document.getElementById('vFrame').style.display = 'block';
  document.getElementById('vFallback').style.display = 'none';
}
